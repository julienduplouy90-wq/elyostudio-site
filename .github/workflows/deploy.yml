name: Construire et déployer sur Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le build échoue si une page publique manque de title, de description
      # ou d'un h1 unique (voir scripts/audit-meta.mjs).
      - run: npm run build

      - name: Envoi FTP vers public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVEUR }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOTDEPASSE }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DOSSIER || '/public_html/' }}
          # Ne supprime pas ce qui n'appartient pas au site (dossiers de mail,
          # fichiers de vérification déposés par Google, etc.).
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess.bak
