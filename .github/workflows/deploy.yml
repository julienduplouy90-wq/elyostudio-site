name: Construire et publier pour Hostinger

# À chaque push sur main : construit le site et pousse le contenu de `dist/`
# sur la branche `hostinger`. Hostinger (hPanel → Avancé → Git) suit cette
# branche et la déploie dans public_html via son webhook. Aucun mot de passe
# FTP, aucun secret à créer.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pousser dist/ sur la branche hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          force_orphan: true
          commit_message: 'Build ${{ github.sha }}'
